<ion-content class="ion-padding">

  <!-- Sección de Medidor -->
  <div class="meter-container">
    <!-- Aquí irá el medidor visual tipo aguja (luego lo armamos) -->
    <div class="needle-panel">
      <!-- Dibujaremos los nombres de notas y una aguja animada -->
      <!-- Ejemplo básico de estructura -->
    </div>
    <div class="hz-display">
      {{ frequency.toFixed(1) }} Hz
    </div>
  </div>

  <!-- Sección de Nota Actual -->
  <div class="note-container">
    <div class="note-label">{{ currentNote }}</div>
    <div class="tune-indicator" [ngClass]="{ 'in-tune': isInTune(), 'out-of-tune': !isInTune() }"></div>
  </div>

  <!-- Sección de Cabeza de Guitarra -->
  <div class="headstock-container">
    <!-- Aquí pondremos una imagen simple o SVG del clavijero con etiquetas -->
  </div>

</ion-content>
