<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center">Seleccione un Instrumento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-fab class="contenedor-principal">
<div class="fila-contenedor">
    <div class="icon-text-wrapper" (click)="goToAfinacion('guitarra')"><img src="assets/img/guitarra.png" width="24" height="24"><span>Guitarra</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('guitarra')"><img src="assets/img/guitarra-electrica.png" width="24" height="24"><span>Guitarra Eléctrica</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('bajo')"><img src="assets/img/bajo.png" width="64" height="64"><span>Bajo</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('ukelele')"><img src="assets/img/ukelele.png" width="24" height="24"><span>Ukelele</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('violin')"><img src="assets/img/violin.png" width="24" height="24"><span>Violin</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('chelo')"><img src="assets/img/chelo.png" width="24" height="24"><span>Chelo</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('contrabajo')"><img src="assets/img/contrabajo.png" width="24" height="24"><span>Contrabajo</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('banjo')"><img src="assets/img/banjo.png" width="24" height="24"><span>Banjo</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('mandolina')"><img src="assets/img/mandolina.png" width="24" height="24"><span>Mandolina</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('cuatro')"><img src="assets/img/cuatro.png" width="24" height="24"><span>Cuatro</span></div>
    <div class="icon-text-wrapper" (click)="goToAfinacion('cavaquinho')"><img src="assets/img/covaquino.png" width="24" height="24"><span>Covaquinho</span></div>
    </div>
</ion-fab>

<ng-container *ngIf="sesionActiva; else invitadoFooter">
  <app-footer-user></app-footer-user>
</ng-container>
<ng-template #invitadoFooter>
  <app-footer></app-footer>
</ng-template>
