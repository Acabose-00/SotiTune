<ion-header translucent="true">
  <ion-toolbar>
    <!-- Botón tipo back -->
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/menu-instrumentos" color="primary"></ion-back-button>
    </ion-buttons>

    <ion-title>Partituras</ion-title>

    <!-- Botón con icono "add" -->
    <ion-buttons slot="end">
      <ion-button color="primary" (click)="goToSubirPartitura()">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content>
  <ion-list>
    <ion-item *ngFor="let partitura of partituras" button (click)="verPartitura(partitura)">
      <ion-label>
        <h2>{{ partitura.titulo || 'Sin nombre' }}</h2>
        <p>Instrumento: {{ partitura.instrumento }}</p>
        <p>Género: {{ partitura.genero_musical }}</p>
      </ion-label>

      <!-- Icono de like (estrella) a la derecha -->
      <ion-icon 
        slot="end" 
        name="star" 
        [style.color]="partitura.likes ? 'gold' : 'gray'" 
        size="large">
      </ion-icon>
    </ion-item>
  </ion-list>

  <ng-container *ngIf="sesionActiva; else invitadoFooter">
    <app-footer-user></app-footer-user>
  </ng-container>
  <ng-template #invitadoFooter>
    <app-footer></app-footer>
  </ng-template>
</ion-content>
