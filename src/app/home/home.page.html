<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center">
      Inicio Sesión
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large" class="ion-text-center">Inicio Sesión</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <ion-list>
      <ion-item>
        <ion-label position="floating"></ion-label>
        <ion-input [(ngModel)]="correo" type="email" placeholder="Ingrese su correo"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating"></ion-label>
        <ion-input [(ngModel)]="contrasena" type="password" placeholder="Ingrese su contraseña"></ion-input>
      </ion-item>
    </ion-list>

    <!-- Mensaje de error lindo -->
    <ion-text color="danger" *ngIf="errorMessage">
      <p class="error-message">{{ errorMessage }}</p>
    </ion-text>

    <div class="button-container">
      <ion-button expand="full" shape="round" color="primary" (click)="iniciarSesion()">
        Iniciar Sesión
      </ion-button>

      <ion-button expand="full" shape="round" fill="outline" (click)="goToPage()">
        Iniciar como Invitado
      </ion-button>
    </div>
  </div>
</ion-content>
