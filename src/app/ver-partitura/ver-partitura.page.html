<ion-header translucent="true">
  <ion-toolbar>
    <ion-title>Visualizar Partitura</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="pdfSrc; else loading">
    <iframe [src]="pdfSrc" width="100%" height="100%" frameborder="0"></iframe>
  </div>
  <ng-template #loading>
    <ion-spinner></ion-spinner>
    <p>Cargando PDF...</p>
  </ng-template>
</ion-content>
